<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Server Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
        height: 100vh;
        overflow: hidden;
    }

    #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    .error {
        color: #ff4d4d;
        font-size: 18px;
    }

    iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        display: none;
    }

    button {
        margin-top: 10px;
        padding: 10px 15px;
        border: none;
        background: #3b82f6;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="status">
    <h3>🔄 সার্ভার চেক করা হচ্ছে...</h3>
</div>

<iframe id="frame"></iframe>

<script>
const SERVER_URL = "http://192.168.0.104:5000";

async function checkServer() {
    try {
        // সার্ভার চলছে কিনা চেক
        const res = await fetch(SERVER_URL, { method: "GET", mode: "no-cors" });

        // যদি ওপেন হয় → iframe দেখাও
        openServer();

    } catch (err) {
        showError();
    }

    // no-cors এ error ধরা কঠিন, তাই timeout fallback
    setTimeout(() => {
        openServer();
    }, 1500);
}

function openServer() {
    document.getElementById("status").style.display = "none";
    const frame = document.getElementById("frame");
    frame.src = SERVER_URL;
    frame.style.display = "block";
}

function showError() {
    document.getElementById("status").innerHTML = `
        <div class="error">❌ সার্ভার চালু নেই</div>
        <p>192.168.0.104:5000 অন করো</p>
        <button onclick="location.reload()">রিফ্রেশ</button>
    `;
}

checkServer();
</script>

</body>
</html>
